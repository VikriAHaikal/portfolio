  <text x="107" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">coursera</text>
  
  <text x="558" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0056D3" text-anchor="end" letter-spacing="0.5">DeepLearning.AI</text>

  <!-- Certificate Heading -->
  <text x="300" y="102" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="4">SPECIALIZATION CERTIFICATE</text>
  <text x="300" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">THIS CERTIFIES THAT</text>

  <!-- Recipient Name -->
  <text x="300" y="166" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">Vikri A. Haikal</text>
  <line x1="140" y1="178" x2="460" y2="178" stroke="#cbd5e1" stroke-width="1"/>

