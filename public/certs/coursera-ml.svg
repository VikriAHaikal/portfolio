  <text x="300" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">has successfully completed the online, non-credit Specialization</text>
  <text x="300" y="228" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0056D3" text-anchor="middle">Machine Learning Specialization</text>
  <text x="300" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Supervised ML · Advanced Learning Algorithms · Unsupervised Learning</text>

  <!-- Seal and Signatures -->
  <!-- Left Signature -->
  <path d="M 60 305 Q 85 290 110 302 T 160 298" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="50" y1="312" x2="170" y2="312" stroke="#94a3b8" stroke-width="1"/>
  <text x="110" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">Andrew Ng</text>
  <text x="110" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Founder, DeepLearning.AI</text>

