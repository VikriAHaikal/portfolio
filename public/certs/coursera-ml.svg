  <text x="38" y="373" font-family="monospace" font-size="8.5" fill="#64748b">Verify: coursera.org/verify/specialization · Credential ID: DL-ML-2024</text>
  <text x="562" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#0056D3" text-anchor="end">Official Certificate ↗</text>
