  <path d="M 24 36 L 36 24 M 24 44 L 44 24" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 576 36 L 564 24 M 576 44 L 556 24" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 24 364 L 36 376 M 24 356 L 44 376" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 576 364 L 564 376 M 576 356 L 556 376" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>

