    <circle cx="0" cy="0" r="27" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="0" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">VERIFIED</text>
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">COURSERA</text>
